<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif" fill="#000000">
  <title>Méthode Palambur · un échange en quatre questions</title>
  <desc>Schéma de l’exemple 01 : la demande de l’utilisateur, quatre questions posées une par message avec des choix A à D, puis deux blocs à copier, le Gabarit Palambur et le Livrable, fermés par le Journal de confiance. Données fictives.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Titre -->
  <text x="40" y="54" font-size="26" font-weight="bold" fill="#1f3a5f">Méthode Palambur</text>
  <text x="40" y="82" font-size="17" fill="#444444">Quatre questions, une à la fois, puis deux blocs à copier · exemple 01, offre d’emploi · données fictives</text>

  <!-- Colonne gauche · la demande -->
  <text x="40" y="122" font-size="13" font-weight="bold" fill="#1f3a5f" letter-spacing="1">LA DEMANDE</text>
  <path d="M 54 135 H 306 Q 320 135 320 149 V 221 Q 320 235 306 235 H 90 L 72 253 L 76 235 H 54 Q 40 235 40 221 V 149 Q 40 135 54 135 Z" fill="#f3f5f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="58" y="172" font-size="19">fais une offre d’emploi</text>
  <text x="58" y="200" font-size="19">pour un peintre à 80 %</text>

  <text x="40" y="300" font-size="13" font-weight="bold" fill="#1f3a5f" letter-spacing="1">L’OUVERTURE</text>
  <rect x="40" y="313" width="280" height="204" rx="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="58" y="345" font-size="16" font-weight="bold">Méthode Palambur.</text>
  <text x="58" y="371" font-size="15">Je vais d’abord vous poser</text>
  <text x="58" y="393" font-size="15">quelques questions, une à la fois,</text>
  <text x="58" y="415" font-size="15">pour ne rien inventer</text>
  <text x="58" y="437" font-size="15">à votre place.</text>
  <line x1="58" y1="456" x2="302" y2="456" stroke="#d9dee6" stroke-width="1"/>
  <text x="58" y="481" font-size="14" fill="#1f3a5f">Niveau de sensibilité · ordinaire</text>
  <text x="58" y="502" font-size="13" fill="#444444">(aucune personne nommée)</text>

  <!-- Flèche demande → questions -->
  <line x1="326" y1="185" x2="366" y2="185" stroke="#1f3a5f" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Colonne centrale · quatre questions -->
  <text x="372" y="122" font-size="13" font-weight="bold" fill="#1f3a5f" letter-spacing="1">QUATRE QUESTIONS, UNE PAR MESSAGE</text>

  <!-- Question 1 · défaut D -->
  <rect x="372" y="135" width="420" height="84" rx="14" fill="#f3f5f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="392" y="165" font-size="16" font-weight="bold">Question 1 sur 4 · le lieu et le cadre</text>
  <circle cx="404" cy="194" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="404" y="199" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">A</text>
  <circle cx="438" cy="194" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="438" y="199" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">B</text>
  <circle cx="472" cy="194" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="472" y="199" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">C</text>
  <circle cx="506" cy="194" r="12" fill="#1f3a5f"/>
  <text x="506" y="199" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
  <text x="530" y="199" font-size="13" fill="#444444">une lettre ou du texte libre</text>

  <!-- Question 2 · défaut B -->
  <rect x="372" y="233" width="420" height="84" rx="14" fill="#f3f5f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="392" y="263" font-size="16" font-weight="bold">Question 2 sur 4 · les missions</text>
  <circle cx="404" cy="292" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="404" y="297" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">A</text>
  <circle cx="438" cy="292" r="12" fill="#1f3a5f"/>
  <text x="438" y="297" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <circle cx="472" cy="292" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="472" y="297" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">C</text>
  <circle cx="506" cy="292" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="506" y="297" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">D</text>
  <text x="530" y="297" font-size="13" fill="#444444">cinq à sept missions, proposées ou fournies</text>

  <!-- Question 3 · défaut B -->
  <rect x="372" y="331" width="420" height="84" rx="14" fill="#f3f5f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="392" y="361" font-size="16" font-weight="bold">Question 3 sur 4 · le profil</text>
  <circle cx="404" cy="390" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="404" y="395" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">A</text>
  <circle cx="438" cy="390" r="12" fill="#1f3a5f"/>
  <text x="438" y="395" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
  <circle cx="472" cy="390" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="472" y="395" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">C</text>
  <circle cx="506" cy="390" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="506" y="395" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">D</text>
  <text x="530" y="395" font-size="13" fill="#444444">titre exigé, CFC ou équivalent, aucun titre</text>

  <!-- Question 4 · défaut A -->
  <rect x="372" y="429" width="420" height="84" rx="14" fill="#f3f5f8" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="392" y="459" font-size="16" font-weight="bold">Question 4 sur 4 · ce que l’entreprise offre</text>
  <circle cx="404" cy="488" r="12" fill="#1f3a5f"/>
  <text x="404" y="493" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  <circle cx="438" cy="488" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="438" y="493" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">B</text>
  <circle cx="472" cy="488" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="472" y="493" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">C</text>
  <circle cx="506" cy="488" r="12" fill="none" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="506" y="493" font-size="13" font-weight="bold" fill="#1f3a5f" text-anchor="middle">D</text>
  <text x="530" y="493" font-size="13" fill="#444444">seulement ce que la direction a validé</text>

  <!-- Légende des lettres -->
  <circle cx="384" cy="531" r="7" fill="#1f3a5f"/>
  <text x="398" y="535" font-size="13" fill="#444444">défaut si vous ne précisez pas · D. Autre / je ne sais pas, toujours en dernier</text>

  <!-- Flèche questions → blocs -->
  <line x1="798" y1="324" x2="838" y2="324" stroke="#1f3a5f" stroke-width="1.5" marker-end="url(#fleche)"/>

  <!-- Colonne droite · deux blocs -->
  <text x="844" y="122" font-size="13" font-weight="bold" fill="#1f3a5f" letter-spacing="1">DEUX BLOCS À COPIER</text>

  <rect x="844" y="135" width="316" height="190" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <rect x="844" y="135" width="316" height="38" rx="10" fill="#1f3a5f"/>
  <rect x="844" y="163" width="316" height="10" fill="#1f3a5f"/>
  <text x="862" y="161" font-size="17" font-weight="bold" fill="#ffffff">Gabarit Palambur</text>
  <text x="862" y="200" font-size="15" font-weight="bold">INSTRUCTION</text>
  <text x="862" y="226" font-size="15" font-weight="bold">RÔLE ET AUDIENCE</text>
  <text x="862" y="252" font-size="15" font-weight="bold">DONNÉES</text>
  <text x="862" y="278" font-size="15" font-weight="bold">CONTRAINTES</text>
  <text x="862" y="304" font-size="15" font-weight="bold">FORMAT</text>

  <rect x="844" y="343" width="316" height="196" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <rect x="844" y="343" width="316" height="38" rx="10" fill="#1f3a5f"/>
  <rect x="844" y="371" width="316" height="10" fill="#1f3a5f"/>
  <text x="862" y="369" font-size="17" font-weight="bold" fill="#ffffff">Livrable</text>
  <text x="862" y="408" font-size="15" font-weight="bold">Peintre en bâtiment CFC (h/f/d)</text>
  <text x="862" y="430" font-size="15">80 % · Yverdon-les-Bains</text>
  <rect x="862" y="445" width="270" height="8" rx="4" fill="#d9dee6"/>
  <rect x="862" y="461" width="236" height="8" rx="4" fill="#d9dee6"/>
  <rect x="862" y="477" width="254" height="8" rx="4" fill="#d9dee6"/>
  <text x="862" y="507" font-size="14" fill="#1f3a5f">[À COMPLÉTER] · [À VÉRIFIER]</text>
  <text x="862" y="527" font-size="13" fill="#444444">ce qui n’a pas été dit reste marqué</text>

  <!-- Bande · Journal de confiance -->
  <rect x="40" y="559" width="1120" height="46" rx="10" fill="#1f3a5f"/>
  <text x="60" y="589" font-size="17" font-weight="bold" fill="#ffffff">Journal de confiance</text>
  <text x="262" y="589" font-size="15" fill="#ffffff">· niveau de sensibilité · données · marqueurs posés · hypothèses refusées · relecture humaine</text>
</svg>
